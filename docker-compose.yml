version: '3.8'

services:
  api:
    build: .
    container_name: translator_api
    depends_on:
      - db
      - duckling
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Host override for Docker internal networking
      - HOST=0.0.0.0
      - PORT=8000
      - DUCKLING_URL=http://translator_duckling:8000/parse
      # Ensure LLM/S3 external dependencies are picked up dynamically from .env
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION_NAME=${AWS_REGION_NAME}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL}
    volumes:
      - .:/app
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    container_name: translator_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-translator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-translator123}
      POSTGRES_DB: ${POSTGRES_DB:-translations_db}
    ports:
      - "5432:5432"
    volumes:
      - translations_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-translator} -d ${POSTGRES_DB:-translations_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  duckling:
    image: rasa/duckling
    container_name: translator_duckling
    platform: linux/amd64
    ports:
      - "8001:8000"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  translations_database:
